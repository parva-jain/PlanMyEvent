name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commit SHAs (tags can be moved); the comment names the release.
jobs:
  verify:
    name: Lint, typecheck, test, build, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Same images and credentials as infra/docker-compose.yml, so the apps' local defaults apply.
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: pme
          POSTGRES_PASSWORD: pme
          POSTGRES_DB: pme
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pme -d pme" --health-interval 5s --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4.11-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Migrations first: db, API and worker tests run against the real schema.
      - name: Migrations apply, and apply again with no changes
        run: pnpm db:migrate && pnpm db:migrate
      - run: pnpm test
      - run: pnpm build

      - name: Migrations are consistent
        run: pnpm db:check
      - name: Schema and migrations are in sync
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "::error::The schema has changes without a migration. Run pnpm db:generate and commit the result."
            git status --porcelain packages/db/drizzle
            exit 1
          fi

      - name: API and worker start against Postgres and Redis
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          node apps/worker/dist/main.js > worker.log 2>&1 &
          for _ in $(seq 30); do
            curl -sf localhost:4000/v1/health/ready > /dev/null && grep -q "processed sample job" worker.log && break
            sleep 1
          done
          curl -sf localhost:4000/v1/health/ready
          grep "processed sample job" worker.log
      - name: Server logs
        if: failure()
        run: cat api.log worker.log || true

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Browsers and their system libraries come preinstalled; installing them on the runner
    # (`playwright install --with-deps`) took over 9 minutes. The tag must match
    # @playwright/test in apps/web/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    # Sign-in tests run the real API and worker (Playwright starts them) against these
    # services; inside a container job they are reached by service name.
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: pme
          POSTGRES_PASSWORD: pme
          POSTGRES_DB: pme
        options: >-
          --health-cmd "pg_isready -U pme -d pme" --health-interval 5s --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4.11-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.6
        options: >-
          --health-cmd "/mailpit readyz" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pme:pme@postgres:5432/pme
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
      MAILPIT_URL: http://mailpit:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
