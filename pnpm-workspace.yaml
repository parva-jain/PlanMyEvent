packages:
  - apps/*
  - packages/*

# Exact versions in package.json; the lockfile pins the rest.
savePrefix: ''

# Packages allowed to run install scripts (pnpm blocks all others).
allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  # Optional native msgpack accelerator for BullMQ; the pure-JS fallback is fine.
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - vite@8.3.5
